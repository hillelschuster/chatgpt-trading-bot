name: crossvenue-series

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ${{ github.event_name == 'schedule' && 'crossvenue-series' || format('crossvenue-probe-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: src

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore latest scheduled series
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data reports
          python src/crossvenue_scheduled_artifact.py --repository "$GITHUB_REPOSITORY" \
            --artifact-name crossvenue-series --branch main \
            --workflow-path .github/workflows/crossvenue-probe.yml \
            --out /tmp/previous.zip --report reports/crossvenue_restoration.json
          if [ -s /tmp/previous.zip ]; then
            python src/crossvenue_bundle.py /tmp/previous.zip --destination . \
              --report reports/crossvenue_restore_bundle.json \
              --required-member data/crossvenue_experiment_freeze.json \
              --required-member data/crossvenue_snapshots.jsonl \
              --required-member reports/crossvenue_chain.json
          fi
      - name: Capture restored baseline
        run: |
          mkdir -p /tmp/crossvenue-prior
          for file in crossvenue_experiment_freeze.json crossvenue_snapshots.jsonl \
            crossvenue_events.jsonl crossvenue_settled_events.jsonl crossvenue_pnl_events.jsonl; do
            if [ -f "data/$file" ]; then cp "data/$file" "/tmp/crossvenue-prior/$file"; fi
          done
      - name: Freeze or verify experiment contract
        run: >-
          python src/crossvenue_freeze.py
          --manifest data/crossvenue_experiment_freeze.json
          --evidence data/crossvenue_snapshots.jsonl
          --evidence data/crossvenue_events.jsonl
          --evidence data/crossvenue_settled_events.jsonl
          --evidence data/crossvenue_pnl_events.jsonl
          --report reports/crossvenue_freeze.json
          --allow-safe-upgrade
      - name: Collect BTC and ETH
        run: |
          python src/crossvenue_snapshot.py --coins BTC,ETH --cadence-seconds 300 \
            --out data/crossvenue_snapshots.jsonl > reports/crossvenue_continuity.json
      - name: Build funding event windows
        run: >-
          python src/crossvenue_events.py data/crossvenue_snapshots.jsonl
          --out data/crossvenue_events.jsonl
          --report reports/crossvenue_events.json
      - name: Measure prospective coverage
        run: >-
          python src/crossvenue_coverage.py
          --snapshots data/crossvenue_snapshots.jsonl
          --events data/crossvenue_events.jsonl
          --freeze-manifest data/crossvenue_experiment_freeze.json
          --report reports/crossvenue_coverage.json
          --coins BTC,ETH
      - name: Join realized funding
        run: >-
          python src/crossvenue_settlements.py data/crossvenue_events.jsonl
          --existing data/crossvenue_settled_events.jsonl
          --out data/crossvenue_settled_events.jsonl
          --report reports/crossvenue_settlements.json
      - name: Compute two-leg PnL
        run: >-
          python src/crossvenue_pnl.py data/crossvenue_settled_events.jsonl
          --freeze-manifest data/crossvenue_experiment_freeze.json
          --out data/crossvenue_pnl_events.jsonl
          --report reports/crossvenue_pnl.json
      - name: Verify append-only evidence
        continue-on-error: true
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then args+=(--require-previous); fi
          python src/crossvenue_chain.py \
            --previous-dir /tmp/crossvenue-prior --current-dir data \
            --report reports/crossvenue_chain.json "${args[@]}"
      - name: Validate and decide
        run: |
          python src/crossvenue_validate.py data/crossvenue_pnl_events.jsonl \
            --freeze-manifest data/crossvenue_experiment_freeze.json \
            --chain-report reports/crossvenue_chain.json \
            --report reports/crossvenue_validation.json \
            --base-ledger data/crossvenue_validation_base_ledger.jsonl \
            --stress-ledger data/crossvenue_validation_stress_ledger.jsonl
          python src/crossvenue_promote.py \
            --validation reports/crossvenue_validation.json \
            --coverage reports/crossvenue_coverage.json \
            --report reports/crossvenue_promotion.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event_name == 'schedule' && 'crossvenue-series' || format('crossvenue-probe-{0}', github.run_id) }}
          path: |
            data/
            reports/
          retention-days: 90
          if-no-files-found: error
