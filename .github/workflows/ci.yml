name: ci

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "docs/**/*.md"
      - "README.md"
      - "PROGRESS.md"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "docs/**/*.md"
      - "README.md"
      - "PROGRESS.md"
      - ".github/workflows/*.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run active tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile active Python
        run: python -m py_compile src/*.py tests/*.py
