name: ci

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "CROSS_VENUE_EXPERIMENT.md"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "*.py"
      - "CROSS_VENUE_EXPERIMENT.md"
      - ".github/workflows/*.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test market evidence pipeline
        run: >-
          python -m unittest -v
          test_crossvenue_snapshot.py
          test_crossvenue_events.py
          test_crossvenue_settlements.py
      - name: Test accounting and validation
        run: >-
          python -m unittest -v
          test_crossvenue_chain.py
          test_crossvenue_pnl.py
          test_crossvenue_freeze.py
          test_crossvenue_validate.py
          test_crossvenue_coverage.py
      - name: Test persistence and workflow
        run: >-
          python -m unittest -v
          test_crossvenue_scheduled_artifact.py
          test_crossvenue_artifact_download.py
          test_crossvenue_bundle.py
          test_crossvenue_collection_provenance.py
      - name: Compile active modules
        run: >-
          python -m py_compile
          crossvenue_snapshot.py
          crossvenue_events.py
          crossvenue_settlements.py
          crossvenue_chain.py
          crossvenue_pnl.py
          crossvenue_freeze.py
          crossvenue_validate.py
          crossvenue_coverage.py
          crossvenue_promote.py
          crossvenue_artifact.py
          crossvenue_scheduled_artifact.py
          crossvenue_bundle.py
